server {
    listen 80;
    root /usr/share/nginx/html;

    # Client-side routes such as /orders/<id> have no file behind them, so
    # anything not found is handed to the React router.
    location / {
        try_files $uri /index.html;
    }

    # Built assets carry a content hash in their name and never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
